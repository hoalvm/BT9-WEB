<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <header th:fragment="header" class="site-header">
        <div class="header-container">
            <div class="header-left">
                <a th:href="@{/}" class="brand-link"></a>
                <nav class="nav-menu">
                    <a th:href="@{/}" class="nav-item active">Trang chủ</a>
                </nav>
            </div>

            <div class="header-right">
                <!-- Guest View -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn-login-header">Đăng nhập</a>
                </div>

                <!-- Authenticated View: displays fullname and images per 02_custom_login_spring_boot4.md -->
                <div class="user-profile" sec:authorize="isAuthenticated()">
                    <img class="user-avatar"
                        th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                        alt="Avatar" width="30" height="30">
                    <div class="user-meta">
                        <span class="user-name" th:text="${#authentication.principal.fullName}">Tên người dùng</span>
                        <span class="user-email" th:text="${#authentication.principal.email}">email@example.com</span>
                        <span class="user-role-badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn-logout" type="submit" id="logout-btn">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </div>
    </header>

</body>

</html>
